---
# This workflow is for CMake-based build/test running on multiple platforms.
name: cmake build

"on": [push, pull_request]

jobs:
  build:
    name: >-
      ${{ matrix.os }}
      ${{ matrix.c_compiler }}
      thr:${{ matrix.threads }}
      rwlock:${{ matrix.rwlock }}
      redir:${{ matrix.redirect_malloc }}
      dll:${{ matrix.shared_libs }}
      cpp:${{ matrix.cplusplus }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6

    strategy:
      # Deliver the feedback for all matrix combinations.
      fail-fast: false

      matrix:
        os:
          - macos-26-intel
          - macos-latest
          - ubuntu-24.04-arm
          - ubuntu-latest
          - windows-11-arm
          - windows-latest
        c_compiler: [cl, clang, gcc]
        cxx_compiler: [cl, clang++, g++]
        build_type: [Release]
        cplusplus: ["off", "on"]
        gc_assertions: ["on"]
        gc_dump: ["on"]
        large_config: ["on"]
        redirect_malloc: ["off", "on"]
        rwlock: ["off", "on"]
        threads: ["off", "on"]
        shared_libs: ["off", "on"]
        exclude:
          - os: macos-26-intel
            c_compiler: cl
          - os: macos-26-intel
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: ubuntu-24.04-arm
            c_compiler: cl
          - os: ubuntu-latest
            c_compiler: cl
          - threads: "off"
            rwlock: "on"
          - c_compiler: cl
            cxx_compiler: clang++
          - c_compiler: cl
            cxx_compiler: g++
          - c_compiler: clang
            cxx_compiler: cl
          - c_compiler: clang
            cxx_compiler: g++
          - c_compiler: gcc
            cxx_compiler: cl
          - c_compiler: gcc
            cxx_compiler: clang++
          - os: macos-26-intel
            cplusplus: "off"
          - os: macos-latest
            cplusplus: "off"
          - os: ubuntu-24.04-arm
            cplusplus: "off"
          - os: ubuntu-latest
            cplusplus: "off"
          - os: windows-latest
            c_compiler: cl
            cplusplus: "off"
          - os: windows-11-arm
            c_compiler: cl
            cplusplus: "off"
          # TODO: replacement operator cannot be inline
          - os: windows-latest
            c_compiler: clang
            cplusplus: "on"
          - os: windows-latest
            c_compiler: gcc
            cplusplus: "off"
          - os: windows-11-arm
            c_compiler: clang
            cplusplus: "on"
          - os: windows-11-arm
            c_compiler: gcc
            cplusplus: "off"
        include:
          - os: windows-latest
            c_compiler: gcc
            cmake_generator_opt: -G "Unix Makefiles"
          - os: windows-latest
            c_compiler: clang
            cmake_generator_opt: -G "Unix Makefiles"
          - os: windows-11-arm
            c_compiler: gcc
            cmake_generator_opt: -G "Unix Makefiles"
          - os: windows-11-arm
            c_compiler: clang
            cmake_generator_opt: -G "Unix Makefiles"

    steps:
      - uses: actions/checkout@v6

      - name: Checkout libatomic_ops repository
        # Only if the compiler does not support GCC atomic intrinsics.
        if: ${{ matrix.c_compiler == 'cl' && matrix.threads == 'on' }}
        uses: actions/checkout@v6
        with:
          repository: bdwgc/libatomic_ops
          path: libatomic_ops

      - name: Configure CMake
        # Configure CMake in a build subdirectory.
        run: >
          cmake -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          ${{ matrix.cmake_generator_opt }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DGC_BUILD_SHARED_LIBS=${{ matrix.shared_libs }}
          -Denable_cplusplus=${{ matrix.cplusplus }}
          -Denable_gc_assertions=${{ matrix.gc_assertions }}
          -Denable_gc_dump=${{ matrix.gc_dump }}
          -Denable_large_config=${{ matrix.large_config }}
          -Denable_redirect_malloc=${{ matrix.redirect_malloc }}
          -Denable_rwlock=${{ matrix.rwlock }}
          -Denable_threads=${{ matrix.threads }}
          -Denable_werror=on
          -Werror=author

      - name: Build
        # Build the code with the given configuration.
        run: >
          cmake --build ${{ github.workspace }}/build
          --config ${{ matrix.build_type }} --verbose --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        # Execute tests defined by the CMake configuration.
        run: >
          ctest --build-config ${{ matrix.build_type }}
          --verbose --parallel 8
