---
# This workflow is to test Linux non-arm64/x86 targets using qemu-user.
name: cmake qemu

"on": [push, pull_request]

jobs:
  build:
    name: >-
      ${{ matrix.target.arch }}
      thr:${{ matrix.threads }} shared:${{ matrix.shared_libs }}
      test:${{ matrix.target.build_testing || 'on' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    strategy:
      # Deliver the feedback for all matrix combinations.
      fail-fast: false

      matrix:
        build_type: [Release]
        cplusplus: ["on"]
        gc_assertions: ["on"]
        gc_debug: ["off"]
        gc_dump: ["on"]
        large_config: ["on"]
        redirect_malloc: ["off"]
        shared_libs: ["off", "on"]
        threads: ["off", "on"]
        target:
          # apt cross-gcc toolchains (Ubuntu universe):
          - arch: arc
            triple: arc-linux-gnu
            # qemu-arc is no longer available.
            build_testing: "off"
            tc_provider: apt
          - arch: armv7
            triple: arm-linux-gnueabihf
            tc_provider: apt
          - arch: hp_pa
            triple: hppa-linux-gnu
            tc_provider: apt
            # TODO: `SIGILL` in disclaimtest, gctest, threadkeytest
            target_threads: "on"
            build_testing: "off"
          - arch: hp_pa
            triple: hppa-linux-gnu
            tc_provider: apt
            # Prevent `SIGILL` in cordtest.
            cflags_extra: "-D AO_DISABLE_GCC_ATOMICS"
            target_threads: "off"
          - arch: loongarch
            triple: loongarch64-linux-gnu
            tc_provider: apt
          - arch: m68k
            triple: m68k-linux-gnu
            tc_provider: apt
            # TODO: crash in subthreadcreatetest, threadkeytest
            target_threads: "on"
            build_testing: "off"
          - arch: m68k
            triple: m68k-linux-gnu
            tc_provider: apt
            target_threads: "off"
          - arch: powerpc
            triple: powerpc-linux-gnu
            tc_provider: apt
          - arch: ppc64
            triple: powerpc64-linux-gnu
            tc_provider: apt
          - arch: riscv64
            triple: riscv64-linux-gnu
            tc_provider: apt
          - arch: s390
            triple: s390x-linux-gnu
            tc_provider: apt
          - arch: sh
            triple: sh4-linux-gnu
            tc_provider: apt
            # TODO: Signals delivery fails constantly in gctest, weakmaptest
            target_threads: "on"
            build_testing: "off"
          - arch: sh
            triple: sh4-linux-gnu
            tc_provider: apt
            target_threads: "off"
          - arch: sparc
            triple: sparc64-linux-gnu
            tc_provider: apt
            # TODO: cpptest, gctest, realloctest are very slow
            target_shared_libs: "on"
            build_testing: "off"
          - arch: sparc
            triple: sparc64-linux-gnu
            tc_provider: apt
            target_shared_libs: "off"
          # Bootlin prebuilt toolchains:
          - arch: mips32
            triple: mips-linux
            tc_provider: bootlin
            tc_ver: "2026.08-1"
          - arch: mips64el
            triple: mips64el-linux
            tc_provider: bootlin
            tc_ver: "2026.08-1"
          - arch: nios2
            triple: nios2-linux
            # qemu-nios2 is no longer available.
            build_testing: "off"
            tc_provider: bootlin
            tc_ver: "2024.05-1"
          - arch: or1k
            triple: or1k-linux
            tc_provider: bootlin
            tc_ver: "2026.08-1"
          - arch: riscv32
            triple: riscv32-linux
            tc_provider: bootlin
            tc_ver: "2026.08-1"
          # Elbrus (LCC toolchain):
          - arch: e2k
            tc_provider: lcc
            # Signals delivery fails constantly in qemu unlike real HW.
            target_threads: "on"
            build_testing: "off"
          - arch: e2k
            tc_provider: lcc
            # Exception handling is unimplemented in qemu for e2k.
            cflags_extra: "-D NO_INCREMENTAL"
            target_threads: "off"
          # Qualcomm Hexagon DSP:
          - arch: hexagon
            # TODO: enable testing
            build_testing: "off"
            tc_provider: qualcomm
            tc_ver: "23.1.0-rc1"
        exclude:
          # FIXME: Undefined reference to `__data_start`
          - shared_libs: "on"
            target:
              arch: nios2
          - shared_libs: "on"
            target:
              arch: or1k
          - shared_libs: "off"
            target:
              target_shared_libs: "on"
          - shared_libs: "on"
            target:
              target_shared_libs: "off"
          - threads: "off"
            target:
              target_threads: "on"
          - threads: "on"
            target:
              target_threads: "off"

    steps:
      - uses: actions/checkout@v7

      - name: Install apt cross toolchain
        if: ${{ matrix.target.tc_provider == 'apt' }}
        # Note: no caching of apt install, as it gives minor speedup.
        run: |
          set -eu
          sudo apt update
          sudo apt install -y --no-install-recommends \
            gcc-${{ matrix.target.triple }} \
            g++-${{ matrix.target.triple }}

      - name: Cache downloaded toolchain
        if: ${{ matrix.target.tc_ver != '' }}
        uses: actions/cache@v6
        id: cache-toolchain
        with:
          path: /tmp/toolchain-${{ matrix.target.arch }}
          key: toolchain2-${{ matrix.target.arch }}-${{ matrix.target.tc_ver }}

      - name: Download and extract Bootlin toolchain
        env:
          DOWNLOAD_BOOTLIN: >-
            ${{ steps.cache-toolchain.outputs.cache-hit != 'true'
                && matrix.target.tc_provider == 'bootlin' }}
        if: ${{ env.DOWNLOAD_BOOTLIN == 'true' }}
        run: |
          set -eu
          case "${{ matrix.target.arch }}" in
            mips64el) bootlin_arch="mips64el-n32" ;;
            or1k) bootlin_arch="openrisc" ;;
            riscv32) bootlin_arch="riscv32-ilp32d" ;;
            *) bootlin_arch="${{ matrix.target.arch }}" ;;
          esac
          base="https://toolchains.bootlin.com/downloads/releases/toolchains"
          name="${bootlin_arch}--glibc--stable-${{ matrix.target.tc_ver }}"
          url="$base/${bootlin_arch}/tarballs/$name.tar.xz"
          tc_dir="/tmp/toolchain-${{ matrix.target.arch }}"
          mkdir -p "$tc_dir"
          curl -Lf "$url" | tar xJf - -C "$tc_dir" --strip-components=1

      - name: Download and extract Qualcomm Hexagon toolchain
        env:
          DOWNLOAD_QC: >-
            ${{ steps.cache-toolchain.outputs.cache-hit != 'true'
                && matrix.target.tc_provider == 'qualcomm' }}
        if: ${{ env.DOWNLOAD_QC == 'true' }}
        run: |
          set -eu
          artifactory="https://artifacts.codelinaro.org/artifactory"
          base="$artifactory/codelinaro-toolchain-for-hexagon"
          name_prefix="clang+llvm-${{ matrix.target.tc_ver }}-cross"
          name="${name_prefix}-hexagon-unknown-linux-musl_x86_64-linux-gnu"
          url="$base/${{ matrix.target.tc_ver }}/${name}.tar.zst"
          tc_dir="/tmp/toolchain-${{ matrix.target.arch }}"
          mkdir -p "$tc_dir"
          curl -Lf "$url" | tar -xf - -I unzstd -C $tc_dir --strip-components=2

      - name: Install e2k (lcc) toolchain
        if: ${{ matrix.target.tc_provider == 'lcc' }}
        uses: mrognor/lcc-env-action@main

      - name: Install qemu
        env:
          INSTALL_QEMU: >-
            ${{ matrix.target.build_testing != 'off'
                && matrix.target.tc_provider != 'lcc' }}
        if: ${{ env.INSTALL_QEMU == 'true' }}
        # Note: there seems no profit in caching of apt install.
        run: |
          set -eu
          sudo apt update
          sudo apt install -y --no-install-recommends qemu-user-binfmt

      - name: Generate CMake toolchain file
        run: |
          set -eu
          # Add toolchain/bin path to `PATH`.
          if [ "v${{ matrix.target.tc_ver }}" != "v" ]; then
            tc_dir="/tmp/toolchain-${{ matrix.target.arch }}"
            PATH="$PATH:$tc_dir/bin"
            echo "$tc_dir/bin" >> "$GITHUB_PATH"
          fi
          # Determine compilers binary name.
          case "${{ matrix.target.tc_provider }}" in
            lcc)
              cc="lcc"
              cxx="l++"
              ;;
            qualcomm)
              cc="hexagon-unknown-linux-musl-clang"
              cxx="hexagon-unknown-linux-musl-clang++"
              ;;
            *)
              cc="${{ matrix.target.triple }}-gcc"
              cxx="${{ matrix.target.triple }}-g++"
              ;;
          esac
          # Determine `sysroot`.
          case "${{ matrix.target.tc_provider }}" in
            lcc) sysroot="." ;;
            qualcomm) sysroot="$tc_dir/target/hexagon-unknown-linux-musl" ;;
            *) sysroot="$($cc --print-sysroot)" ;;
          esac
          # Determine qemu `-L` path.
          case "${{ matrix.target.tc_provider }}" in
            apt)
              qemu_ld_prefix="/usr/${{ matrix.target.triple }}"
              ;;
            lcc)
              ld_path=$(find /opt/mcst -name ld-linux.so.2 \
                        -path "*/fs/lib64/ld-linux.so.2" | head -n 1)
              if [ -z "$ld_path" ]; then
                echo "Error: ld-linux.so.2 not found"
                exit 1
              fi
              # Strip `lib64/ld-linux.so.2` from the path.
              qemu_ld_prefix=$(dirname $(dirname "$ld_path"))
              ;;
            *)
              qemu_ld_prefix="$sysroot"
              ;;
          esac
          # Determine name of qemu emulator to run.
          case "${{ matrix.target.arch }}" in
            armv7) qemu_arch="arm" ;;
            hp_pa) qemu_arch="hppa" ;;
            loongarch) qemu_arch="loongarch64" ;;
            powerpc) qemu_arch="ppc" ;;
            s390) qemu_arch="s390x" ;;
            sh) qemu_arch="sh4" ;;
            sparc) qemu_arch="sparc64" ;;
            mips32) qemu_arch="mips" ;;
            mips64el) qemu_arch="mipsn32el" ;;
            *) qemu_arch="${{ matrix.target.arch }}" ;;
          esac
          case "${{ matrix.target.tc_provider }}" in
            lcc) qemu_bin="qemu-e2k-static" ;;
            *) qemu_bin="qemu-${qemu_arch}" ;;
          esac
          tc_file="/tmp/toolchain-${{ matrix.target.arch }}.cmake"
          {
            echo "set(CMAKE_CROSSCOMPILING_EMULATOR" \
                      " \"$qemu_bin;-L;$qemu_ld_prefix\")"
            echo "set(CMAKE_CXX_COMPILER $cxx)"
            echo "set(CMAKE_C_COMPILER $cc)"
            echo "set(CMAKE_FIND_ROOT_PATH $sysroot)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)"
            echo "set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)"
            echo "set(CMAKE_SYSTEM_NAME Linux)"
            echo "set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.target.arch }})"
          } > "$tc_file"
          echo "Generated toolchain file:"
          cat "$tc_file"
          echo "TC_FILE=$tc_file" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: >
          cmake -B ${{ github.workspace }}/build
          -S ${{ github.workspace }}
          -DCFLAGS_EXTRA="${{ matrix.target.cflags_extra || '' }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.TC_FILE }}
          -DGC_BUILD_SHARED_LIBS=${{ matrix.shared_libs }}
          -Denable_cplusplus=${{ matrix.cplusplus }}
          -Denable_gc_assertions=${{ matrix.gc_assertions }}
          -Denable_gc_debug=${{ matrix.gc_debug }}
          -Denable_gc_dump=${{ matrix.gc_dump }}
          -Denable_large_config=${{ matrix.large_config }}
          -Denable_redirect_malloc=${{ matrix.redirect_malloc }}
          -Denable_threads=${{ matrix.threads }}
          -Denable_werror=on
          -Werror=author

      - name: Build
        run: >
          cmake --build ${{ github.workspace }}/build
          --config ${{ matrix.build_type }} --verbose --parallel

      - name: Execute tests in qemu-user
        if: ${{ matrix.target.build_testing != 'off' }}
        working-directory: ${{ github.workspace }}/build
        run: >
          ctest --build-config ${{ matrix.build_type }} --verbose --parallel
