---
# This workflow is for build/test using `Makefile.direct`.
name: make direct build

"on": [push, pull_request]

jobs:
  build:
    name: >-
      ${{ matrix.os }} ${{ matrix.c_compiler }} ${{ matrix.cflags_extra }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 6

    strategy:
      # Deliver the feedback for all matrix combinations.
      fail-fast: false

      matrix:
        os: [macos-latest, ubuntu-26.04-arm, ubuntu-latest, windows-latest]
        c_compiler: [clang, gcc]
        cxx_compiler: [clang++, g++]
        cflags_extra:
          - -DGC_THREADS -DPARALLEL_MARK -DTHREAD_LOCAL_ALLOC
          - -O3 -Wall -Wextra -Werror
        exclude:
          - os: macos-latest
            c_compiler: gcc
          - c_compiler: clang
            cxx_compiler: g++
          - c_compiler: gcc
            cxx_compiler: clang++
        include:
          - os: windows-latest
            cflags_target: >-
              -D_CRT_SECURE_NO_DEPRECATE -DDONT_USE_USER32_DLL
              -Wno-deprecated-declarations -Wno-inline-new-delete
            curses_opt: CURSES="-lgdi32 -luser32"

    steps:
      - uses: actions/checkout@v7

      - name: Checkout libatomic_ops repository
        uses: actions/checkout@v7
        with:
          repository: bdwgc/libatomic_ops
          path: libatomic_ops

      - name: Find clang++ (Windows)
        # Workaround STL "unexpected compiler version" error (use the Clang
        # bundled with Visual Studio).
        if: ${{ runner.os == 'Windows' && matrix.c_compiler == 'clang' }}
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang `
            -property installationPath
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
          $clangxx = Join-Path $llvmBin "clang++.exe"
          if (-not (Test-Path $clangxx)) {
            throw "Visual Studio Clang compiler not found: $clangxx"
          }
          & $clangxx --version
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Build
        run: >
          make -j8 -f Makefile.direct
          CC=${{ matrix.c_compiler }}
          CXX=${{ matrix.cxx_compiler }}
          CFLAGS_EXTRA="${{ matrix.cflags_extra }}
          ${{ matrix.cflags_target }}"

      - name: Test
        run: >
          make -f Makefile.direct check cord/de
          CC=${{ matrix.c_compiler }}
          CXX=${{ matrix.cxx_compiler }}
          CFLAGS_EXTRA="${{ matrix.cflags_extra }}
          ${{ matrix.cflags_target }}"
          ${{ matrix.curses_opt }}

      - name: Print tests output (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: bash
        run: |
          find . -name '*.gc.log' | while read -r file; do
            echo "Contents of $file:"
            cat "$file"
          done

      - name: Test enforcing mprotect-based VDB
        env:
          GC_USE_GETWRITEWATCH: "0"
        run: sh -c ./gctest
